[project]
name = "semantic-search-engine"
version = "0.1.0"
description = "Local semantic search over PDF collections: docling parsing, Hugging Face embeddings and reranking"
readme = "README.md"
authors = [
    { name = "Manteplante", email = "matiasmantepizarro@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "docling>=2.140.0",
    "huggingface-hub>=1.33.0",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "sqlalchemy>=2.1.5",
    "torch>=2.14.1",
    "transformers>=5.20.1",
]

[tool.uv]
# An application of top-level packages (ingestion/, parsing/, search/, app/), not a library.
package = false

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "ruff==0.16.3",
]

[tool.uv]
constraint-dependencies = ["certifi>=2026.10.19"]